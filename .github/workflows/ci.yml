name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.9 ist die dokumentierte Untergrenze und das System-Python von macOS.
      # Eine neuere Version wuerde genau die Syntaxfehler durchwinken, an denen
      # Nutzer mit dem System-Python haengen bleiben.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Skripte unter Python 3.9 kompilieren
        run: python -m py_compile nightshift/scripts/build_zip.py 24x7/scripts/build_zip.py scripts/build_release.py

      - name: Generatoren ausfuehren und ZIP-Inhalt pruefen
        run: python -m unittest discover -s tests -p 'test_generatoren.py' -v

      - name: Blockmuster des PreToolUse-Hooks pruefen
        run: python -m unittest discover -s tests -p 'test_block_muster.py' -v

      # Prueft das erzeugte Dockerfile und die Compose-Datei und laesst den
      # Runner ohne Isolation gegen einen Stub laufen: er muss abbrechen.
      # Der Lauf im Container selbst passiert hier nicht, der braucht
      # Bauzeit und ein Netz.
      - name: Isolation des erzeugten Setups pruefen
        run: python -m unittest discover -s tests -p 'test_isolation.py' -v

      # Kostenzaehler und Receipt laufen gegen einen claude-Stub, es
      # entsteht kein API-Aufruf und keine Rechnung.
      - name: Kostenbudget und Morning Receipt pruefen
        run: python -m unittest discover -s tests -p 'test_kosten_receipt.py' -v

      # Baut dieselben Artefakte, die der Release-Workflow an ein Tag haengt,
      # und schaut hinein. Ein kaputtes Paket faellt so vor dem Tag auf.
      - name: Release-Artefakte bauen und Inhalt pruefen
        run: python -m unittest discover -s tests -p 'test_paket.py' -v
